services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - '5432:5432'

  web:
      build: .
      command: python manage.py runserver 0.0.0.0:8000
      volumes:
        - .:/app
      ports:
        - '8000:8000'
        - '5678:5678'
      stdin_open: true
      tty: true
      env_file:
        - .env
      environment:
        - DEBUG
        - DJANGO_ALLOWED_HOSTS
        - POSTGRES_DB
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_HOST
        - POSTGRES_PORT
      depends_on:
        - db

volumes:
  postgres_data:
